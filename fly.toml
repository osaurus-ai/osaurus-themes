# fly.toml app configuration for osaurus-themes
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'osaurus-themes'
primary_region = 'lax'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep one machine warm so the challenge -> sign -> save flow never lands on
  # a cold machine (a slow cold start can chew through the 60s nonce TTL).
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  grace_period = "5s"
  interval = "15s"
  method = "get"
  timeout = "5s"
  path = "/livez"

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
